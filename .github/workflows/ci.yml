name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-windows:
    name: Offline tests (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Configure checkout line endings
        shell: bash
        run: git config --global core.autocrlf true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required: the frozen-contract tests assert
          # byte-identity of the protocol YAML against parent commit
          # c2e1a8d via `git show`, which a depth-1 clone cannot serve.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: kernel

      - name: Install locked workspace
        run: uv sync --locked

      - name: Lint committed Python surfaces
        run: uv run ruff check src tests benchmarks

      - name: Test Rust kernel
        run: cargo test --locked --manifest-path kernel/Cargo.toml

      - name: Run offline Python suite
        run: uv run pytest -n 4
