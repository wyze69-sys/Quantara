    provider: binance_usd_m_futures
    venue: binance
    market_type: perpetual
    native_interval: [1m, 1h, 1d]
    description: BTCUSDT perpetual traded-price OHLCV, 2020-2024
    role: btc_price_lane
    status: already_canonical_immutable
