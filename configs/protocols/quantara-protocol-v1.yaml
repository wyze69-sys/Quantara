canonical_lane_immutability:
  subject: btcusdt_perp_ohlcv (Binance USD-M BTCUSDT perpetual traded-price OHLCV, 2020-2024, at 1m/1h/1d)
  rule: >-
    The already-canonical Binance USD-M BTCUSDT perpetual traded-price OHLCV lane
    is immutable input: its published identities, pointers, descriptors, parser
    identity, manifests, quality evidence, and canonical bytes must not be
    altered. Protocol packets may read it but never modify it.
canonical_record_fields:
  - provider
  - venue
  - market_type
  - instrument_id
  - provider_symbol
  - series_id
  - native_interval
  - source_file
  - source_sha256
  - event_ts
  - interval_open_ts
  - interval_close_ts
  - settlement_or_snapshot_ts
  - archive_publication_ts
  - ingestion_ts
  - eligibility_ts
  - quality_flags
exclusions:
  forbidden_families:
    - liquidations
    - options
    - long_short_ratios
    - taker_ratios
    - altcoins
    - order_books
    - macro
    - on_chain
    - sentiment
    - news
    - technical_indicator_searches
  rules:
    - >-
      Incidental columns in the Binance metrics archive may be retained in the
      immutable raw object but are not canonical Protocol-v1 series and must not
      enter any feature table.
    - >-
      docs/superpowers/plans/2026-08-29-data-slice-013-vision-derivatives-backfill.md
      is superseded for Protocol v1; its top-trader and taker-ratio scope, guessed
      completeness rules, and combined metrics feature direction are not authorized.
target:
  origin_convention: >-
    For hourly origin t, P[t] is the BTCUSDT perpetual 1h bar close at T - 1 ms and
    the future endpoint is the 1h bar close at T + 24h - 1 ms.
  r24: 'r24_t  = log(P[t+24h] / P[t])'
  sigma: 'sigma_t = sqrt(sum_{j=0}^{23} r[t-j]^2)'
  zscore: 'Z_t    = abs(r24_t) / sigma_t'
  label: 'Y_t    = 1[Z_t > k]'
  threshold: k = empirical Q80(Z_t) on eligible 2020-2021 design origins only
  threshold_design_end: '2021-12-31T23:59:59.999Z'
  threshold_design_rule: >-
    An origin enters the Q80 calculation only when its complete forward label ends
    no later than 2021-12-31 23:59:59.999 UTC. No 2022 value may enter threshold
    design.
realized_volatility:
  definition: RV_H = sqrt(sum of squared eligible hourly log returns over H hours)
  horizons:
    rv_1d: 24
    rv_7d: 168
    rv_30d: 720
  invalid_window_rule: >-
    A zero or incomplete window is invalid; no epsilon replacement is permitted.
feature_formulas:
  funding_24h_sum: sum settled rates with T-24h < settlement_ts <= T
  dlog_oi_24h: log(OI_snapshot_ending_T / OI_snapshot_ending_T_minus_24h)
  native_premium_1h_mean: arithmetic mean of the 60 native-premium 1m closes ending in (T-1h, T]
  spot_perp_dislocation: log(BTC_perp_close_T / Binance_BTC_spot_close_T)
  eth_ret_1h: log(ETH_perp_close_T / ETH_perp_close_T_minus_1h)
  eth_rv_24h: sqrt(sum of the 24 eligible ETH hourly log returns ending at T)
  eth_funding_24h_sum: ETH form of funding_24h_sum
  eth_native_premium_1h_mean: ETH form of native_premium_1h_mean
  eth_btc_relative_ret_24h: ETH_ret_24h(T) - BTC_ret_24h(T)
  eth_dlog_oi_24h: ETH form of dlog_oi_24h
  kraken_ret_1h: log(Kraken_close_T / Kraken_close_T_minus_1h)
  kraken_rv_24h: sqrt(sum of the 24 eligible Kraken hourly log returns ending at T)
  binance_kraken_ret_divergence_1h: Binance_spot_ret_1h(T) - Kraken_ret_1h(T)
  binance_kraken_cross_quote_log_ratio: log(Binance_spot_close_T / Kraken_close_T)
feature_window_completeness:
  - Every formula requires its full endpoint/path window.
  - Funding requires a cadence-complete settlement window.
  - OI requires the exact five-minute snapshots ending at both endpoints and no intervening gap.
  - 1m premium means require all 60 minutes.
  - >-
    Return/RV windows crossing any invalid source interval are null. There is no
    stale-value tolerance, interpolation, nearest timestamp, or alternate horizon.
dislocation_roles:
  primary_futures_dislocation_feature: btc_native_premium_1m
  diagnostic_only:
    - mark_index_minus_1
    - mark_spot_minus_1
  rule: >-
    Native Binance premium is the pre-registered primary futures-dislocation feature.
    Constructed mark/index - 1 and mark/spot - 1 are diagnostics only and never enter
    M1-M4. Mark and index are canonicalized because they verify source integrity and
    support diagnostics, not because they earn independent model stages.
model_ladder:
  B0:
    base: null
    adds: []
    definition: training-only climatology
  B1:
    base: null
    adds:
      - log(RV_1d)
    definition: logistic model using causal log(RV_1d)
  B2:
    base: null
    adds:
      - log(RV_1d)
      - log(RV_7d)
      - log(RV_30d)
    definition: HAR-style logistic model
  M1:
    base: B2
    adds:
      - funding_24h_sum
      - dlog_oi_24h
      - native_premium_1h_mean
    definition: B2 plus frozen BTC derivatives block
  M2:
    base: M1
    adds:
      - spot_perp_dislocation
    definition: M1 plus BTC perpetual versus Binance spot dislocation
  M3:
    base: M2
    adds:
      - eth_ret_1h
      - eth_rv_24h
      - eth_funding_24h_sum
      - eth_native_premium_1h_mean
      - eth_btc_relative_ret_24h
    definition: M2 plus frozen ETH family, excluding ETH OI
  M3b:
    base: M3
    adds:
      - eth_dlog_oi_24h
    definition: M3 plus ETH dlog_oi_24h on the identical post-2021-12-01 common sample
  M4:
    base: M3
    adds:
      - kraken_ret_1h
      - kraken_rv_24h
      - binance_kraken_ret_divergence_1h
      - binance_kraken_cross_quote_log_ratio
    definition: M3 plus frozen Kraken cross-venue family
model_mandates:
  btc_core_ladder: [M1, M2]
  mandatory_primary_candidate: M2
  mandatory_rule: M2 must pass the complete gate versus paired B2 before 2025 can unlock
  optional_family_order: [M3, M4]
  optional_family_rule: >-
    Starting from M2, evaluate the ETH block and then the Kraken block as the only
    optional additions.
  m3b_role: >-
    M3b/ETH OI is a secondary diagnostic and can never alter the retained candidate;
    ETH OI is M3b common-sample only.
  final_rule: >-
    The resulting candidate must still pass the complete 2%-versus-B2 and calibration
    gate before 2025.
cross_quote_dislocation_policy:
  feature: binance_kraken_cross_quote_log_ratio
  rule: >-
    log(Binance BTCUSDT spot close / Kraken XBT/USD close) uses no invented
    USD/USDT FX conversion; the feature is explicitly a cross-venue, cross-quote
    dislocation and may include quote-currency (USDT-versus-USD) effects.
logistic_constants:
  estimation_discipline: exact-Decimal logistic-IRLS
  l2_penalty_lambda: '1'
  unpenalized_intercept: true
  standardization: train-window z-score
  max_iterations: 50
  convergence_tolerance: '0.000000000001'
  eta_clamp: 24
  probability_clamp: '0.000000000001'
  linear_solver: Gaussian elimination with partial pivoting
search_and_calibration_restrictions:
  forbidden:
    - regularization_search
    - feature_clipping
    - post_hoc_probability_calibration
    - tree_model
    - model_family_search
  calibration_evaluation: Calibration is evaluated on the raw logistic probabilities.
  paired_comparison_rule: >-
    For every paired candidate comparison, refit the comparator on exactly the same
    training rows and score exactly the same test timestamps as the candidate. A
    larger baseline sample may be reported separately but cannot be used for the
    paired incremental claim.
point_in_time:
  cutoff_convention: >-
    An hourly information cutoff T is an exact UTC hour boundary. prediction_ts =
    T + 1 ms. This one-millisecond computational convention orders already-completed
    data; it is not a claim about exchange network latency.
  kline_eligibility: >-
    For a kline with source close time C, nominal eligibility_ts = C + 1 ms;
    completed klines become nominally eligible after interval close.
  funding_eligibility: >-
    For settled funding with source calculation/settlement time F, nominal
    eligibility_ts = F + 1 ms; settled funding becomes nominally eligible after
    its settlement timestamp.
  oi_eligibility: >-
    For a five-minute OI row with interval-start timestamp O, nominal
    eligibility_ts = O + 5 minutes; OI becomes nominally eligible only after the
    end of its five-minute snapshot interval.
  kraken_eligibility: >-
    For Kraken hourly OHLCVT with interval-start timestamp K, nominal
    eligibility_ts = K + 1 hour.
  join_rule: >-
    All joins are backward as-of joins on eligibility_ts; eligibility_ts <
    prediction_ts without exception.
  archive_publication_ts_role: >-
    Archive publication time is ex-post provenance, not the real-time availability
    of observations.
  forbidden:
    - nearest_joins
    - forward_joins
    - unfinished_bars
    - future_revisions
    - same_timestamp_equality
  limitation: >-
    Protocol v1 claims nominal historical point-in-time safety, not reconstruction
    of historical network latency. This limitation must appear in every result
    report.
missing_and_duplicate_policy:
  rules:
    - Missing is null, never zero.
    - No price, mark, index, premium, OI, or venue gap is interpolated.
    - A feature is invalid when a required lookback crosses a missing native interval.
    - A label is invalid when its required BTC price endpoints/path are unavailable.
    - Known pre-archive periods remain null and receive no fabricated regime flag.
    - >-
      Exact duplicate source rows may be deterministically deduplicated only after
      byte comparison, with source-row count, distinct-row count, duplicate count,
      and duplicate hashes preserved.
    - Same-key conflicting rows block publication.
    - ETH OI before 2021-12-01 is null and never enters M3.
validation:
  outer_folds:
    - fold: 1
      train_start: '2020-09-01'
      train_end: '2021-12-31'
      test_year: 2022
    - fold: 2
      train_start: '2020-09-01'
      train_end: '2022-12-31'
      test_year: 2023
    - fold: 3
      train_start: '2020-09-01'
      train_end: '2023-12-31'
      test_year: 2024
  fold_rules:
    - Remove training origins whose 24-hour labels cross a boundary.
    - Use a 24-hour purge.
    - >-
      Apply only the frozen train-window z-score and fixed regularization described
      in logistic_constants.
    - No clipping or post-hoc calibration is allowed.
    - Never use random K-fold.
  primary_metric:
    - 'BS(model) = mean((p-y)^2)'
    - 'BSS_B2(model) = 1 - BS(model) / BS(B2)'
    - loss_improvement_i = loss_B2_i - loss_model_i
    - probability_bias = mean(p-y)
  calibration_diagnostics:
    method: unpenalized logistic regression of y on logit(p) with an intercept
    clamp: 'clamp p to [0.000000000001, 0.999999999999] only for the logarithm'
    outputs: [calibration_intercept, calibration_slope]
    note: >-
      Diagnostic only; these calculations do not alter predictions. Log loss,
      ROC-AUC, PR-AUC, calibration bias/intercept, and calibration slope are
      diagnostics; AUC cannot pass the gate.
  bootstrap:
    method: paired moving-block bootstrap over hourly loss differentials
    block_hours: 168
    resamples: 2000
    interval: '0.95'
    resampling: resampled within year and then pooled
    rng_seed: 20260831
success_gate:
  unlock_rule: The frozen candidate may unlock 2025 only if all criteria hold.
  criteria:
    - id: 1
      rule: pooled BSS_B2 >= 0.02
      threshold: '0.02'
    - id: 2
      rule: bootstrap 95% lower bound for BS_B2 - BS_candidate is greater than zero
    - id: 3
      rule: positive Brier improvement in at least two validation years
      min_years: 2
    - id: 4
      rule: no year has BSS_B2 < -0.02
      threshold: '-0.02'
    - id: 5
      rule: pooled absolute probability bias is at most 0.02
      threshold: '0.02'
    - id: 6
      rule: pooled calibration slope is between 0.8 and 1.2
      lower: '0.8'
      upper: '1.2'
    - id: 7
      rule: yearly absolute probability bias is at most 0.04
      threshold: '0.04'
optional_family_retention:
  order: [eth_block, kraken_block]
  retention_criteria:
    - pooled relative Brier improvement versus the currently retained model is at least 0.01
    - unadjusted two-sided 95% paired-bootstrap interval has a lower bound above zero
    - >-
      one-sided bootstrap p-value passes Holm at family-wise alpha 0.05 across these
      two optional-family tests
    - at least two years improve
    - no year is worse than -0.02
  holm_family_wise_alpha: '0.05'
  holm_test_count: 2
  fallback: >-
    If ETH is rejected, compare Kraken against M2, not against an ETH-containing
    model.
  rejected_block_rule: A rejected block receives no alternative transformation search.
sealed_2025:
  state: SEALED
  scoring_permission: FORBIDDEN_UNTIL_GATE_PASS
  allowed_pre_gate_checks:
    - file_inventory
    - cryptographic_hashes
    - parser_compatibility
    - expected_boundaries
    - mechanical_corruption
  forbidden_operations:
    - labels
    - feature_distributions
    - model_scores
    - conditional_outcome_inspection
    - protocol_adaptation
  on_gate_pass: run exactly one frozen 2025 evaluation
  failure_outcome: DID_NOT_REPLICATE
  failure_rule: never redesign and retest on 2025
