# Quantara Protocol v1 - machine-readable frozen protocol.
# Human-readable counterpart: docs/superpowers/specs/2026-08-31-quantara-protocol-v1.md
# Status: FROZEN_BEFORE_2022_2024_SCORING. Decimal thresholds are quoted strings.
protocol_id: quantara-protocol-v1
protocol_status: FROZEN_BEFORE_2022_2024_SCORING
frozen_date: '2026-08-31'
planning_baseline: 2f24ad6f30850e8a90dfaca661b1ed8b1d9f1b57
research_question: >-
  Can pre-registered BTC derivatives, spot/perpetual divergence, ETH cross-market
  state, and one independent BTC venue improve probability forecasts of unusually
  large BTCUSDT 24-hour moves beyond a strong causal volatility-persistence
  baseline?
